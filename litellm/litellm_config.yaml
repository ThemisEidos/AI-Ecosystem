model_list:
  - model_name: "qwen2.5:7b"
    litellm_params:
      model: ollama/qwen2.5:7b
      # Docker containers must reach the host Ollama daemon via host.docker.internal.
      api_base: http://host.docker.internal:11434
  - model_name: mistral
    litellm_params:
      model: ollama/mistral
      # Optional secondary local fallback for conversational continuity.
      api_base: http://host.docker.internal:11434
  - model_name: local-llama
    litellm_params:
      model: ollama/llama3.2
      # Emergency / lightweight fallback for conversational continuity.
      api_base: http://host.docker.internal:11434
  - model_name: COOPER - Private
    litellm_params:
      model: ollama/qwen2.5:7b
      # User-facing Private Workshop identity alias.
      api_base: http://host.docker.internal:11434
  - model_name: openai
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: openrouter
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  fallbacks:
    - "qwen2.5:7b":
        - mistral
        - local-llama
    - gemini:
        - gemini-pro
