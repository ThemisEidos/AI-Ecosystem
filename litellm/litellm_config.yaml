model_list:
  - model_name: local-llama
    litellm_params:
      model: ollama/llama3.2
      # Docker containers must reach the host Ollama daemon via host.docker.internal.
      api_base: http://host.docker.internal:11434
  - model_name: cooper-personality
    litellm_params:
      model: ollama/cooper-personality
      # Keep the local personality model visible through the same Ollama gateway.
      api_base: http://host.docker.internal:11434
  - model_name: openai
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: openrouter
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  fallbacks:
    - gemini:
        - gemini-pro
