services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: pda-open-webui
    labels:
      ai.ecosystem.stack: open
    ports:
      - "3000:8080"
    environment:
      # Fallback for fresh installs only — v0.9.6 SQLite takes precedence after first run.
      # Add the connection manually via Settings → Connections in the UI (see CLAUDE.md).
      # Container DNS, not host.docker.internal — cooper-core is a real container on this network.
      - OPENAI_API_BASE_URL=http://cooper-core:8000/v1
      - OPENAI_API_KEY=${COOPER_API_KEY-cooper-local}
    volumes:
      - open-webui:/app/backend/data
    networks:
      - pda-open-net
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: pda-n8n
    labels:
      ai.ecosystem.stack: open
    ports:
      - "5678:5678"
    environment:
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
    volumes:
      - n8n-data:/home/node/.n8n
      - ..:/files:ro
    networks:
      - pda-open-net
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: pda-litellm
    labels:
      ai.ecosystem.stack: open
    ports:
      - "4000:4000"
    command: --config /app/config.yaml --detailed_debug
    env_file:
      - ../litellm/.env.local
    volumes:
      - ../litellm/litellm_config.yaml:/app/config.yaml:ro
    networks:
      - pda-open-net
    restart: unless-stopped

  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.100
    container_name: pda-open-signal-cli
    labels:
      ai.ecosystem.stack: open
    restart: unless-stopped
    environment:
      - MODE=native
    volumes:
      - ./data/signal:/home/.local/share/signal-cli
    ports:
      - "127.0.0.1:8080:8080"   # loopback only — registration/linking via localhost
    networks:
      - pda-open-net

  cooper-core:
    build:
      context: ..
      dockerfile: cooper-core/Dockerfile
    container_name: pda-open-cooper-core
    labels:
      ai.ecosystem.stack: open
    ports:
      - "8001:8000"
    environment:
      - WORKSHOP=open
      - OPENAI_BASE_URL=http://litellm:4000/v1
      # LITELLM_MASTER_KEY here is resolved from the shell env or a PDA-Runtime/.env file
      # (Compose-level interpolation) — NOT from litellm/.env.local, which only populates the
      # litellm service's own container env. The two files must be kept in sync manually:
      # whatever LITELLM_MASTER_KEY is set to in litellm/.env.local must also be set as
      # LITELLM_MASTER_KEY in PDA-Runtime/.env (copy from .env.example), or this falls back to
      # the literal "cooper-local" and every /chat call gets rejected by LiteLLM with a 401
      # unless its real master key also happens to be "cooper-local".
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-cooper-local}
      - COOPER_DB_PATH=/app/data/cooper_memory.db
      - COOPER_API_KEY=${COOPER_API_KEY-cooper-local}
      - GATEWAY_ENABLED=${GATEWAY_ENABLED:-0}
      - SIGNAL_API_URL=http://signal-cli:8080
      - SIGNAL_NUMBER=${SIGNAL_NUMBER:-}
      - SIGNAL_ALLOWED_SENDERS=${SIGNAL_ALLOWED_SENDERS:-}
      - COOPER_API_KEYS=${COOPER_API_KEYS:-}
    volumes:
      - cooper-core-data:/app/data
      - type: bind
        source: "../Obsidian Vault/brain"
        target: "/app/Obsidian Vault/brain"
        read_only: true
    networks:
      - pda-open-net
    depends_on:
      - litellm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  open-webui:
    external: true
    name: open-webui
  n8n-data:
  cooper-core-data:
    name: pda-open-cooper-core-data

networks:
  pda-open-net:
    name: pda-open-net
