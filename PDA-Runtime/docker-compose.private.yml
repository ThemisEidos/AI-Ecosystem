name: pda-private

services:
  private-ollama:
    image: ollama/ollama:latest
    container_name: pda-private-ollama
    labels:
      ai.ecosystem.stack: private
    environment:
      - OLLAMA_NO_CLOUD=true
      # 6 GB VRAM is the binding constraint on this host: flash attention plus a
      # q8_0 KV cache frees ~300 MiB, which is what lets a 12B quant stay fully
      # GPU-resident instead of splitting layers to CPU.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    volumes:
      - private-ollama:/root/.ollama
    networks:
      - pda-private-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  model-init:
    image: ollama/ollama:latest
    container_name: pda-private-model-init
    labels:
      ai.ecosystem.stack: private
    environment:
      - OLLAMA_HOST=http://private-ollama:11434
    entrypoint: ["sh", "-c", "ollama pull gemma4:12b && ollama cp gemma4:12b COOPER-Private && ollama pull nomic-embed-text"]
    networks:
      - pda-private-net
    depends_on:
      private-ollama:
        condition: service_healthy
    restart: "no"

  cooper-core:
    build:
      context: ..
      dockerfile: cooper-core/Dockerfile
    container_name: pda-private-cooper-core
    labels:
      ai.ecosystem.stack: private
    ports:
      - "8000:8000"
    environment:
      - WORKSHOP=private
      - OLLAMA_HOST=http://private-ollama:11434
      - COOPER_DB_PATH=/app/data/cooper_memory.db
      - COOPER_API_KEY=${COOPER_API_KEY-cooper-local}
      - COOPER_API_KEYS=${COOPER_API_KEYS:-}
    volumes:
      - cooper-core-data:/app/data
      - type: bind
        source: "../Obsidian Vault/brain"
        target: "/app/Obsidian Vault/brain"
        read_only: true
      - type: bind
        source: "../Skills"
        target: "/app/Skills"
      - type: bind
        source: "../Config/skills_registry.yaml"
        target: "/app/Config/skills_registry.yaml"
    networks:
      - pda-private-net
    depends_on:
      private-ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  private-open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: pda-private-open-webui
    labels:
      ai.ecosystem.stack: private
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://private-ollama:11434
    volumes:
      - private-open-webui-main:/app/backend/data
    networks:
      - pda-private-net
    depends_on:
      - private-ollama
    restart: unless-stopped

volumes:
  private-ollama:
    name: pda-private-ollama
  private-open-webui-main:
    name: pda-private-open-webui-main
  cooper-core-data:
    name: pda-private-cooper-core-data

networks:
  pda-private-net:
    name: pda-private-net
    # internal: true removed — see spec §4 (confirmed 2026-07-02): it blocked
    # `ollama pull` AND silently disabled the stack's published ports. The
    # Private/Open boundary is enforced at the app layer (workshop.py + auth).
