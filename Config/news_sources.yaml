# News Reel sources (Step 14d, re-scoped 2026-09-05).
#
# Curation lives here, as data, so adding or dropping a source is an owner edit
# rather than a code change. Every feed below was fetched and parsed on
# 2026-09-05 before being written down; candidates that returned 403/404 or
# unparseable bodies were dropped rather than shipped hopefully.
#
# An item inherits its feed's category -- no model classifies or routes.
# `category` values are fixed; adding one means adding a section to the reel.
#
# VERIFY FROM INSIDE THE CONTAINER, not the host. Both CISA XML feeds were
# verified working from the dev machine and then 403'd in production on the
# first live run: CISA's WAF allows the static /feeds/*.json path but blocks the
# dynamic .xml views for the container's fingerprint, while the same request
# from the host succeeds. A source list verified in the wrong environment is a
# source list that has not been verified.
#   docker exec pda-open-cooper-core python -c "...executor._run_rss_fetch(url)"

sources:
# Replaced CISA All Advisories (403 in-container, see header). CERT/CC is the
# closest analogue -- authoritative, numbered vulnerability advisories -- and
# SANS ISC adds daily practitioner triage.
- category: cyber
  name: CERT/CC Vulnerability Notes
  url: https://www.kb.cert.org/vuls/atomfeed/
