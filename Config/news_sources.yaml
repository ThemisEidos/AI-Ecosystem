# Weakest category: Votebeat, Democracy Docket, Brennan Center and NCSL all
# 404'd or blocked on 2026-09-05. NPR Politics is general politics, so the
# analysis step filters it for election relevance. The reel reports a thin
# category honestly rather than padding it.
- category: election
  name: Election Law Blog
  url: https://electionlawblog.org/?feed=rss2
- category: election
  name: Stateline
  url: https://stateline.org/feed/
- category: election
  name: Verified Voting
  url: https://verifiedvoting.org/feed/
- category: election
  name: NPR Politics
  url: https://feeds.npr.org/1014/rss.xml

# Severity filter is IN the URL on purpose: unfiltered this feed returns ~266
# active alerts, overwhelmingly minor, which would drown every other category.
# Severe+Extreme returns ~40. Both verified 2026-09-05.
- category: weather_hazard
  name: NWS Severe/Extreme Alerts
  url: https://api.weather.gov/alerts/active.atom?severity=Severe,Extreme&status=actual
- category: weather_hazard
  name: NHC Atlantic
  url: https://www.nhc.noaa.gov/index-at.xml
- category: weather_hazard
  name: NOAA Storm Prediction Center
  url: https://www.spc.noaa.gov/products/spcrss.xml
- category: weather_hazard
  name: USGS M4.5+ Earthquakes
  url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom
- category: weather_hazard
  name: InciWeb Wildfires
  url: https://inciweb.wildfire.gov/incidents/rss.xml
