registry_name: COOPER Open Workshop Tool Registry
workshop: Open Workshop
version: 1
purpose: Open Workshop tools only.
generated_at: "2026-06-14"
tools:
  - id: status_summary
    name: Status Summary
    drawer: Operations
    workshop: Open Workshop
    description: Provide a quick operational summary of the current chat or workspace context.
    permission_level: 0
    approval_required: false
    executor_type: informational
    enabled: true
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    inputs:
      - chat_context
    outputs:
      - short_summary
    notes: Inform-only. No external action.
  - id: registry_inspector
    name: Registry Inspector
    drawer: Tool Box
    workshop: Open Workshop
    description: Read approved registry entries and configuration status for Open Workshop tools.
    permission_level: 1
    approval_required: false
    executor_type: local_read
    enabled: true
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    inputs:
      - registry_path
    outputs:
      - registry_snapshot
    notes: Read-only inspection tool.
  - id: browser_research
    name: Browser Research
    drawer: Research
    workshop: Open Workshop
    description: Review public web pages and approved local pages for non-sensitive research.
    permission_level: 3
    approval_required: true
    executor_type: browser
    enabled: true
    parameters:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
          description: "One or more https:// URLs to research. At least one is required."
        search_terms:
          type: string
          description: "Optional search terms to focus the research summary."
      required:
        - urls
      additionalProperties: false
    inputs:
      - urls
      - search_terms
    outputs:
      - evidence_notes
      - source_links
    notes: Open Workshop only. Do not use for restricted data.
  - id: lite_llm_router
    name: LiteLLM Router
    drawer: AI Models
    workshop: Open Workshop
    description: Route approved prompts to configured cloud or local language models.
    permission_level: 3
    approval_required: true
    executor_type: llm_api
    enabled: true
    parameters:
      type: object
      properties:
        prompt:
          type: string
          description: "The exact prompt to send to the routed model — no tool-invocation framing, just the task itself."
        model:
          type: string
          description: "Optional model name to route to. Defaults to the workshop's configured model if omitted."
      required:
        - prompt
      additionalProperties: false
    inputs:
      - prompt
      - model_hint
    outputs:
      - model_response
    notes: Open Workshop only. Use only with approved content.
  - id: obsidian_note_writer
    name: Obsidian Note Writer
    drawer: Knowledge Shelf
    workshop: Open Workshop
    description: Create or update non-sensitive notes in the Obsidian Knowledge Shelf.
    permission_level: 2
    approval_required: true
    executor_type: note_editor
    enabled: true
    parameters:
      type: object
      properties:
        filename:
          type: string
          no_path_separators: true
          description: "Bare markdown filename like 'meeting-notes.md'. No directories — notes land in the vault inbox for human filing; subdirectory targets are refused, not silently flattened."
        content:
          type: string
          description: "The full markdown content of the note."
      required:
        - filename
        - content
      additionalProperties: false
    inputs:
      - note_path
      - markdown_content
    outputs:
      - note_path
    notes: Use for open project knowledge only.
  - id: powershell_open
    name: PowerShell Open Runner
    drawer: Automation
    workshop: Open Workshop
    description: Run approved local PowerShell scripts for open-workshop tasks.
    permission_level: 4
    approval_required: true
    executor_type: powershell
    allowed_scripts:
      - Test-Exec.ps1
      - Test-PDAStack.ps1
    enabled: true
    parameters:
      type: object
      properties:
        script:
          type: string
          no_path_separators: true
          description: "Filename of an allowlisted PowerShell script under Scripts/, e.g. 'Test-PDAStack.ps1'."
      required:
        - script
      additionalProperties: false
    inputs:
      - script_path
      - arguments
    outputs:
      - script_output
    notes: Local execution only. No destructive actions in Phase 1.
  - id: python_open
    name: Python Open Runner
    drawer: Automation
    workshop: Open Workshop
    description: Run approved local Python scripts for open-workshop analysis and reporting.
    permission_level: 4
    approval_required: true
    executor_type: python
    allowed_scripts:
      - Test-Exec.py
    enabled: true
    parameters:
      type: object
      properties:
        script:
          type: string
          no_path_separators: true
          description: "Filename of an allowlisted Python script under Scripts/Python/, e.g. 'Test-Exec.py'."
      required:
        - script
      additionalProperties: false
    inputs:
      - script_path
      - arguments
    outputs:
      - script_output
    notes: Local execution only. No destructive actions in Phase 1.
  - id: n8n_general_workflows
    name: n8n General Workflows
    drawer: Automation
    workshop: Open Workshop
    description: Run approved general-purpose n8n workflows for non-sensitive automation.
    permission_level: 4
    approval_required: true
    executor_type: workflow_engine
    allowed_workflows:
      pda_command_router: pda-command-router
      chat_bridge_http: pda-chat-bridge-http
    enabled: true
    parameters:
      type: object
      properties:
        workflow:
          type: string
          description: "Key into this tool's allowed_workflows mapping, e.g. 'pda_command_router'."
        payload:
          type: string
          description: "Optional text payload passed to the workflow."
      required:
        - workflow
      additionalProperties: false
    inputs:
      - workflow_id
      - payload
    outputs:
      - workflow_result
    notes: >-
      Open Workshop only. May integrate with external services when approved.
      allowed_workflows is a manually-reviewed allowlist, not just an existence
      check — each entry was inspected for unsafe node types (executeCommand
      building shell strings from unescaped input, in particular) before being
      added. Never add a workflow here without that review.
  - id: codex_task_launcher
    name: Codex Task Launcher
    drawer: Code
    workshop: Open Workshop
    description: Prepare an approved Codex task file for implementation work in Codex_Tasks.
    permission_level: 4
    approval_required: true
    executor_type: cli_launcher
    enabled: true
    parameters:
      type: object
      properties:
        request:
          type: string
          description: "Plain-language description of the task to turn into a governed Codex task file."
      required:
        - request
      additionalProperties: false
    inputs:
      - repo_path
      - task_file
    outputs:
      - launch_status
    notes: Used by WF-002 to write governed Codex task files. Launcher handoff remains optional.
  - id: import_skill
    name: Import Skill
    drawer: Skills
    workshop: Open Workshop
    description: Import a community SKILL.md skill from a tap repository into the Open workshop. Usage — import skill <name> from <https url>. Shows the SKILL.md for review before approval.
    permission_level: 2
    approval_required: true
    executor_type: skill_import
    enabled: true
    parameters:
      type: object
      properties:
        skill_name:
          type: string
          description: "Lowercase skill id, e.g. 'stack-health-check'. Must match [a-z0-9][a-z0-9-]*."
        tap_url:
          type: string
          description: "https:// URL of the tap repository containing skills/<skill_name>/SKILL.md."
      required:
        - skill_name
        - tap_url
      additionalProperties: false
    inputs:
      - skill_name
      - tap_url
    outputs:
      - manifest_entry
    notes: Fetches stage to Skills/_incoming (inert) at preview time; registration happens only after approval. Open Workshop only — skill_import is classified cloud-calling.
  - id: promote_skill
    name: Promote Skill
    drawer: Skills
    workshop: Open Workshop
    description: Promote a drafted skill from Skills/_drafts into the live registry. Usage — promote skill <name>. Shows the draft SKILL.md for review before approval.
    permission_level: 2
    approval_required: true
    executor_type: skill_promote
    enabled: true
    parameters:
      type: object
      properties:
        skill_name:
          type: string
          description: "Lowercase id of the drafted or already-registered skill to promote."
      required:
        - skill_name
      additionalProperties: false
    inputs:
      - skill_name
    outputs:
      - manifest_entry
    notes: Local filesystem only. Drafts are created by the Proposer after successful runs.
