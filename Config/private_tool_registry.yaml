registry_name: COOPER Private Workshop Tool Registry
workshop: Private Workshop
version: 1
purpose: Private Workshop tools only.
generated_at: "2026-06-14"
tools:
  - id: status_summary_private
    name: Status Summary
    drawer: Operations
    workshop: Private Workshop
    description: Provide a quick summary of the current private workshop context.
    permission_level: 0
    approval_required: false
    executor_type: informational
    enabled: true
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    inputs:
      - chat_context
    outputs:
      - short_summary
    notes: Inform-only. No external action.
  - id: registry_inspector_private
    name: Registry Inspector
    drawer: Tool Box
    workshop: Private Workshop
    description: Read approved private registry entries and local configuration status.
    permission_level: 1
    approval_required: false
    executor_type: local_read
    enabled: true
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    inputs:
      - registry_path
    outputs:
      - registry_snapshot
    notes: Read-only inspection tool.
  - id: restricted_dmz_writer
    name: Restricted DMZ Writer
    drawer: Restricted DMZ Workspace
    workshop: Private Workshop
    description: Create or update non-sensitive output files inside the approved Restricted DMZ Workspace.
    permission_level: 2
    approval_required: true
    executor_type: filesystem
    enabled: true
    parameters:
      type: object
      properties:
        filename:
          type: string
          no_path_separators: true
          description: "Bare filename for the DMZ workspace, e.g. 'analysis.txt'. No directories."
        content:
          type: string
          description: "The full text content to write."
      required:
        - filename
        - content
      additionalProperties: false
    inputs:
      - file_path
      - content
    outputs:
      - file_path
    notes: Private Workshop only. Never write to Secure Vault or Obsidian.
  - id: qwen_local_assistant
    name: Qwen Local Assistant
    drawer: Local Models
    workshop: Private Workshop
    description: Use the local Qwen model for private analysis and drafting inside the Restricted DMZ Workspace.
    permission_level: 2
    approval_required: true
    executor_type: local_llm
    enabled: true
    parameters:
      type: object
      properties:
        prompt:
          type: string
          description: "The analysis or drafting prompt to send to the local model."
      required:
        - prompt
      additionalProperties: false
    inputs:
      - prompt
      - context
    outputs:
      - draft_response
    notes: Local only. No cloud fallback.
  - id: powershell_private
    name: PowerShell Private Runner
    drawer: Local Automation
    workshop: Private Workshop
    description: Run approved local PowerShell scripts for private-workshop tasks.
    permission_level: 4
    approval_required: true
    executor_type: powershell
    allowed_scripts:
      - Test-Exec.ps1
      - Test-PDAStack.ps1
    enabled: true
    parameters:
      type: object
      properties:
        script:
          type: string
          no_path_separators: true
          description: "Filename of an allowlisted PowerShell script under Scripts/, e.g. 'Test-PDAStack.ps1'."
      required:
        - script
      additionalProperties: false
    inputs:
      - script_path
      - arguments
    outputs:
      - script_output
    notes: Local execution only. No cloud calls.
  - id: python_private
    name: Python Private Runner
    drawer: Local Automation
    workshop: Private Workshop
    description: Run approved local Python scripts for private-workshop analysis and reporting.
    permission_level: 4
    approval_required: true
    executor_type: python
    allowed_scripts:
      - Test-Exec.py
    enabled: true
    parameters:
      type: object
      properties:
        script:
          type: string
          no_path_separators: true
          description: "Filename of an allowlisted Python script under Scripts/Python/, e.g. 'Test-Exec.py'."
      required:
        - script
      additionalProperties: false
    inputs:
      - script_path
      - arguments
    outputs:
      - script_output
    notes: Local execution only. No cloud calls.
  - id: restricted_workflow_runner
    name: Restricted Workflow Runner
    drawer: Local Automation
    workshop: Private Workshop
    description: Run approved local workflows that stay entirely inside the private workshop boundary.
    permission_level: 4
    approval_required: true
    executor_type: workflow_engine
    enabled: true
    parameters:
      type: object
      properties:
        workflow:
          type: string
          description: "Key into this tool's allowed_workflows mapping (currently empty — this tool is fail-closed until workflows are added)."
        payload:
          type: string
          description: "Optional text payload passed to the workflow."
      required:
        - workflow
      additionalProperties: false
    inputs:
      - workflow_id
      - payload
    outputs:
      - workflow_result
    notes: Local only. Forbidden to call cloud services or third-party providers.
  - id: promote_skill
    name: Promote Skill
    drawer: Skills
    workshop: Private Workshop
    description: Promote a drafted skill from Skills/_drafts into the live registry. Called with a skill_name argument. Shows the draft SKILL.md for review before approval.
    permission_level: 2
    approval_required: true
    executor_type: skill_promote
    enabled: true
    parameters:
      type: object
      properties:
        skill_name:
          type: string
          no_path_separators: true
          description: "Lowercase id of the drafted or already-registered skill to promote."
      required:
        - skill_name
      additionalProperties: false
    inputs:
      - skill_name
    outputs:
      - manifest_entry
    notes: Local filesystem only. Registers the skill for the private workshop.
  - id: fabric_pattern_writer_private
    name: Fabric Pattern Writer
    drawer: Local Models
    workshop: Private Workshop
    description: >-
      Fill a reusable Fabric prompt pattern from raw notes or conversation text, using the
      local model only. Available patterns: report-summary (Reporting), research-synthesis
      (Research), review-checklist (Review), security-triage (Security). Name the pattern by
      its id or category, and pass the raw text to work from as content_input.
    permission_level: 2
    approval_required: true
    executor_type: fabric_pattern
    enabled: true
    parameters:
      type: object
      properties:
        pattern_name:
          type: string
          description: "Which Fabric pattern to apply, e.g. 'report-summary' or 'security'. Loosely matched — exact id or category name both work."
        content_input:
          type: string
          description: "The raw text (notes, conversation, workflow output) the pattern should be applied to."
        audience:
          type: string
          description: "Optional — who the output is for. Defaults to 'the owner' if omitted."
        focus:
          type: string
          description: "Optional — what the output should emphasize. Defaults to the main point of the input if omitted."
        tone:
          type: string
          description: "Optional — desired tone. Defaults to direct and neutral if omitted."
        priority:
          type: string
          description: "Optional — urgency framing. Defaults to normal if omitted."
      required:
        - pattern_name
        - content_input
      additionalProperties: false
    inputs:
      - pattern_name
      - content_input
    outputs:
      - filled_template
    notes: Private Workshop only. Runs on local Ollama — content never leaves the machine.
